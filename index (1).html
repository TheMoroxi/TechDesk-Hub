<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechDesk Hub v0.2.2.0</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<aside class="sidebar">


<h2>
🔧 TechDesk Hub
</h2>


<p class="version">
v0.2.2
</p>



<button onclick="showPage('dashboard')">
🏠 Dashboard
</button>


<button onclick="showPage('repairs')">
🔧 Naprawy
</button>


<button onclick="showPage('inventory')">
📦 Magazyn
</button>


<button onclick="showPage('receipts')">
🧾 Paragony
</button>


<button onclick="showPage('notes')">
📝 Notatki
</button>



<div class="bottom">
⚙ Ustawienia
</div>


</aside>





<main class="content">





<section id="dashboard" class="page active">


<h1>
🏠 Dashboard
</h1>


<div class="cards">


<div class="card">

<h2 id="repairCount">
0
</h2>

<p>
Naprawy
</p>

</div>



<div class="card">

<h2 id="partsCount">
0
</h2>

<p>
Części
</p>

</div>



<div class="card">

<h2 id="receiptCount">
0
</h2>

<p>
Paragony
</p>

</div>



<div class="card">

<h2 id="noteCount">
0
</h2>

<p>
Notatki
</p>

</div>



</div>


</section>







<section id="repairs" class="page">


<h1>
🔧 Naprawy
</h1>



<div class="box">


<h3>
Nowa naprawa
</h3>



<input id="device"
placeholder="Urządzenie">



<input id="client"
placeholder="Klient">



<input id="problem"
placeholder="Problem">



<select id="repairStatus">


<option>
Nowe
</option>


<option>
Diagnoza
</option>


<option>
Naprawa
</option>


<option>
Gotowe
</option>


</select>




<input id="repairCost"
placeholder="Koszt zł">



<textarea id="repairNote"
placeholder="Notatka techniczna">
</textarea>



<button onclick="addRepair()">
💾 Zapisz naprawę
</button>



</div>





<div class="box">


<h3>
Lista napraw
</h3>



<div id="repairList">

</div>



</div>



</section>









<section id="inventory" class="page">


<h1>
📦 Magazyn
</h1>



<div class="box">


<h3>
Dodaj część
</h3>


<input id="partName"
placeholder="Nazwa części">



<input id="partCount"
placeholder="Ilość">



<button onclick="addPart()">
➕ Dodaj
</button>



</div>




<div class="box">


<h3>
Stan magazynu
</h3>



<div id="inventoryList">

</div>



</div>



</section>









<section id="receipts" class="page">


<h1>
🧾 Paragony
</h1>



<div class="box">


<input id="receiptClient"
placeholder="Klient">



<input id="receiptService"
placeholder="Usługa">



<input id="receiptPrice"
placeholder="Cena">



<button onclick="addReceipt()">
➕ Dodaj paragon
</button>



</div>





<div class="box">


<h3>
Historia
</h3>



<div id="receiptList">

</div>



</div>



</section>









<section id="notes" class="page">


<h1>
📝 Notatki
</h1>



<div class="box">


<textarea id="noteText"
placeholder="Treść notatki">
</textarea>



<button onclick="addNote()">
💾 Zapisz
</button>



</div>





<div class="box">


<h3>
Lista notatek
</h3>



<div id="notesList">

</div>



</div>



</section>







</main>


</div>





<script src="app.js"></script>


<script>


function showPage(page){


document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);



document
.getElementById(page)
.classList.add("active");


}


</script>



</body>

</html>
