<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechDesk Hub</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

    <div class="logo">
        🔧 TechDesk Hub
    </div>


    <button>
        ⚙ Ustawienia
    </button>

</header>



<section class="hero">

    <h1>TECHDESK HUB</h1>

    <p>
        Technician Workspace
    </p>


    <div class="status">
        <span></span>
        SYSTEM ONLINE
    </div>


</section>




<section class="cards">


<div class="card">

    <div class="icon">🔧</div>

    <h2>Naprawy</h2>

    <p id="repairCount">
        0 aktywnych
    </p>

</div>



<div class="card">

    <div class="icon">📦</div>

    <h2>Części</h2>

    <p>
        843 elementy
    </p>

</div>




<div class="card">

    <div class="icon">📝</div>

    <h2>Notatki</h2>

    <p>
        57 zapisów
    </p>

</div>


</section>





<section class="panel">


<h2>
🔧 Repair Manager
</h2>



<div class="repair-form">


<input 
id="device"
placeholder="Urządzenie np. iPhone 13"
>



<input
id="problem"
placeholder="Problem np. brak ładowania"
>



<select id="repairStatus">


<option>
Nowe
</option>

<option>
Diagnoza
</option>

<option>
Naprawa
</option>

<option>
Gotowe
</option>


</select>



<button onclick="addRepair()">

➕ Dodaj naprawę

</button>



</div>




<div id="repairList">


</div>


</section>







<section class="panel">


<h2>
⚡ Quick Actions
</h2>



<div class="buttons">


<button>
📦 Magazyn
</button>


<button>
⚡ Kalkulatory
</button>


<button>
📄 Raporty
</button>


</div>


</section>







<footer>

TechDesk Hub v0.1
<br>
Local Technician System

</footer>



</div>




<script src="app.js"></script>


</body>

</html>
