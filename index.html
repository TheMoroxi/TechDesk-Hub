<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechDesk Hub</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<div class="logo">
🔧 TechDesk Hub
</div>

<button>
⚙
</button>

</header>



<section class="hero">

<h1>TECHDESK HUB</h1>

<p>
Technician Workspace v0.2
</p>


<div class="status">

<span></span>

SYSTEM ONLINE

</div>

</section>





<section class="cards">


<div class="card">

<div class="icon">
🔧
</div>

<h2>Naprawy</h2>

<p id="repairCount">
0
</p>

</div>



<div class="card">

<div class="icon">
📦
</div>

<h2>Części</h2>

<p id="partsCount">
0
</p>

</div>



<div class="card">

<div class="icon">
📝
</div>

<h2>Notatki</h2>

<p id="notesCount">
0
</p>

</div>


</section>







<section class="panel">


<h2>
🔧 Nowa naprawa
</h2>



<div class="repair-form">


<input 
id="device"
placeholder="Urządzenie np. Samsung S21">



<input
id="client"
placeholder="Klient">



<input
id="phone"
placeholder="Telefon kontaktowy">



<input
id="problem"
placeholder="Problem">





<select id="status">

<option>
Nowe
</option>

<option>
Diagnoza
</option>

<option>
Naprawa
</option>

<option>
Gotowe
</option>

</select>





<input
id="cost"
type="number"
placeholder="Koszt zł">





<textarea
id="note"
placeholder="Notatka techniczna">
</textarea>





<button onclick="addRepair()">

➕ Zapisz naprawę

</button>


</div>


</section>







<section class="panel">


<h2>
📋 Lista napraw
</h2>



<input
id="search"
placeholder="🔍 Szukaj..."
oninput="renderRepairs()">



<div id="repairList">

</div>


</section>





<footer>

TechDesk Hub v0.2

</footer>


</div>




<script src="app.js"></script>


</body>

</html>
