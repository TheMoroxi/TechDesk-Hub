<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDesk Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <div class="logo">
            🔧 <span>TechDesk Hub</span>
        </div>

        <button class="settings">
            ⚙ Ustawienia
        </button>
    </header>


    <section class="hero">
        <h1>TECHDESK HUB</h1>
        <p>Technician Workspace</p>

        <div class="status">
            <span></span> SYSTEM ONLINE
        </div>
    </section>


    <section class="cards">

        <div class="card">
            <div class="icon">🔧</div>
            <h2>Naprawy</h2>
            <p>12 aktywnych</p>
        </div>


        <div class="card">
            <div class="icon">📦</div>
            <h2>Części</h2>
            <p>843 elementy</p>
        </div>


        <div class="card">
            <div class="icon">📝</div>
            <h2>Notatki</h2>
            <p>57 zapisów</p>
        </div>

    </section>



    <section class="panel">

        <h2>⚡ Quick Actions</h2>

        <div class="buttons">

            <button>
                ➕ Nowa naprawa
            </button>

            <button>
                📦 Dodaj część
            </button>

            <button>
                ⚡ Kalkulatory
            </button>

            <button>
                📄 Raport
            </button>

        </div>

    </section>



    <section class="panel">

        <h2>📋 Ostatnie działania</h2>

        <div class="activity">

            <p>
                ✅ Wymiana USB-C Samsung A52
            </p>

            <p>
                ✅ Dodano ESP32 x5
            </p>

            <p>
                ⚠ Oczekuje na część #0421
            </p>

        </div>

    </section>



    <footer>
        TechDesk Hub v0.1 • Local Technician System
    </footer>


</div>


</body>
</html>
